<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body class="bg-body-tertiary">
    <main class="conatiner min-vh-100 d-flex justify-content-center align-items-center py-5">
      <section class="card shadow.sm border-0 w-100 auth-card">
        <div class="card-body p4 p-md p-md-5">
          <h1 class="text-center mb-4">Register here</h1>
          <form id="register-form">
            <div class="mb-3">
              <label for="name" class="form-label">Username</label>
              <input type="text" id="name" name="name" class="form-control" autocomplete="username" minlength="3" required />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-control" autocomplete="email" required />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <p id="message" class="mt-3 small" aria-live="polite"></p>

          <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="index.html">Login here</a>
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
