<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social App</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body class="bg-body-tertiary">
    <main class="conatiner min-vh-100 d-flex justify-content-center align-items-center py-5">
      <section class="card shadow-sm border-0 w-100 auth-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="text-center mb-4">Login</h1>
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label">Email</label>
              <input type="email" id="login-email" name="email" class="form-control" autocomplete="email" required />
            </div>
            <div class="mb-4">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" name="password" class="form-control" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <p id="login-message" class="mt-3 small" aria-live="polite"></p>

          <p class="text-center mt-4 mb-0">
            Dont't have an account?
            <a href="register.html">Register here</a>
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
