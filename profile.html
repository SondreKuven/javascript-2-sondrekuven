<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-dark" data-bs-theme="dark">
      <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand" href="./feed.html">Social App</a>

        <div class="d-flex align-items-center gap-3">
          <a class="nav-link text-white active" href="./feed.html" aria-current="page">Feed</a>
          <a class="nav-link text-white" href="./profile.html">My Profile</a>
          <button id="logout-button" type="button" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <h1 class="mb-4">Profile</h1>
        </div>
        <section id="profile-container" class="card shadow-sm border-0 p-4 mb-4" aria-label="Profile information">
          <p>Loading profile...</p>
        </section>

        <section aria-labelledby="profile-posts-heading">
          <h2 class="h4 mb-3" id="profile-posts-heading">Posts</h2>
          <div id="profile-posts" class="d-grid gap-3"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
